[package]
name = "virtio-mem-service"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "Windows service for publishing native memory telemetry"

[dependencies]
virtio-mem-core = { path = "../crates/virtio-mem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
winapi = { version = "0.3", features = ["handleapi", "memoryapi", "psapi", "sddl", "securitybaseapi", "sysinfoapi", "winbase", "winnt", "winsvc"] }

[[bin]]
name = "virtio-mem-service"
path = "src/main.rs"

[[bin]]
name = "virtio-mem-workload"
path = "src/bin/virtio-mem-workload.rs"
