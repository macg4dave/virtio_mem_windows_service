[package]
name = "virtio-mem-service"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "Windows service for virtio-mem integration with QEMU Guest Agent"

[dependencies]
virtio-mem-core = { path = "../crates/virtio-mem-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
anyhow = "1.0"
quick-xml = "0.41.0"
tracing = "0.1"
tracing-subscriber = "0.3"
winapi = { version = "0.3", features = ["errhandlingapi", "fileapi", "handleapi", "ioapiset", "namedpipeapi", "processthreadsapi", "psapi", "synchapi", "winbase", "winerror", "winsvc", "sysinfoapi", "winnt"] }

[dev-dependencies]
mockall = "0.15.0"

[[bin]]
name = "virtio-mem-service"
path = "src/main.rs"
