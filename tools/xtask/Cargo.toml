[package]
name = "virtio-mem-xtask"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "Repository build, test, and validation control-plane tooling"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "1.1.8"
virtio-mem-core = { path = "../../crates/virtio-mem-core" }
virtio-mem-host = { path = "../../host" }
wait-timeout = "0.2"
