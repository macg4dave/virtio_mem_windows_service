[package]
name = "virtio-mem-host"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "RHEL systemd controller executing guest virtio-mem requests from a shared pool"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.20"
signal-hook = "0.3"
virtio-mem-core = { path = "../crates/virtio-mem-core" }

[[bin]]
name = "virtio-mem-host"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
