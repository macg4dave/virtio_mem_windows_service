# Windows service manifest for win11_gpu.
#
# What it is: the settings for VirtioMemService inside the guest. Windows uses
# them to decide when to ask the host for more RAM and when to give RAM back.
# The host (host.toml) then decides how much it can grant.
#
# How to use it:
#   1. Edit the values below.
#   2. make win11-build    # only when the service code changed
#   3. make win11-deploy   # writes C:\ProgramData\VirtioMemService\config.json
#                          # and restarts VirtioMemService in the guest
#   Preview without changing the guest:
#   cargo xtask windows deploy deploy/win11_gpu/windows-manifest.toml \
#     --output .artifacts/windows/win11_gpu/deploy-dry-run.json
#
# Sizes take "8GB", "8.5GB", "1024MB", "512KB" or a plain byte count. Units are
# binary: 1GB = 1024MB = 2^30 bytes. Times are in milliseconds.
#
# How much RAM Windows has: the VM boots with 8GB of fixed RAM, and the
# virtio-mem device adds 0 to 19GB on top (the device is 20GB; the host never
# grants the last 1GB). Every "device RAM" amount below is on top of the 8GB.

schema_version = 2 # manifest format; leave at 2

# ---- Identity: must match the [[vm]] table in host.toml ----------------------

vm_name = "win11_gpu"           # libvirt domain name (host.toml: name)
service_name = "VirtioMemService" # Windows service (host.toml: telemetry_service_name)
display_name = "Virtio Memory Telemetry Service"
description = "Decides and publishes guest memory requests with native Windows telemetry for the host virtio-mem controller."
# Where Windows publishes telemetry and its request; the host writes its
# answer beside it as <path>.host-status (host.toml: telemetry_path).
telemetry_path = 'C:\ProgramData\VirtioMemService\telemetry.json'
service_account = 'NT AUTHORITY\LocalService'
install_path = 'C:\Program Files\VirtioMemService\virtio-mem-service.exe'

# ---- Service timing ---------------------------------------------------------

# How often Windows samples memory, decides and publishes.
poll_interval_millis = 5000
# How long a service stop may take before the process is failed.
shutdown_timeout_millis = 30000

# ---- When to ask for RAM ----------------------------------------------------

[policy]
# Most RAM asked for in one request. Pressure that needs more is met by
# further requests, one at a time. Multiple of 2MB.
grow_step_bytes = "1GB"
# Most RAM given back in one request. Keep it large: the viomem driver only
# searches a window this size starting at the oldest RAM, and small steps
# return almost nothing (64MB steps returned 2MB). Multiple of 2MB, under 4GB.
shrink_step_bytes = "3GB"
# Host answers older (or further in the future) than this are not used to
# plan a new request.
host_status_max_age_millis = 30000
# A request the host has not admitted within this is expired. At most 60000.
request_lifetime_millis = 30000
# After a release comes up short, Windows waits one history_window before
# trying again; each release in a row that returns nothing doubles the wait,
# up to this many windows (16 x 5 min = 80 min). Some of the oldest RAM never
# comes back, so this stops Windows asking for it every window. At least 1.
max_removal_pause_windows = 16

[policy.target]
# Device RAM Windows never gives back. Minimum Windows RAM = 8GB + this.
# "0GB" lets Windows shrink to its 8GB of boot RAM.
configured_minimum_bytes = "0GB"

# Windows asks for more RAM whenever available RAM would fall below
# physical_reserve, or commit headroom (commit limit minus commit charge)
# below commit_reserve. Larger values keep more free RAM in the guest.
physical_reserve_bytes = "2GB"
commit_reserve_bytes = "2GB"

# Giving RAM back never leaves less than these free. Must be no larger than
# the matching reserve above; the gap between them is room to settle.
safe_floor_physical_reserve_bytes = "1GB"
safe_floor_commit_reserve_bytes = "1GB"

# ---- When to give RAM back --------------------------------------------------

# Windows releases RAM only after a surplus has lasted this long with Windows
# reporting High memory. It is also the unit of the pause after a short
# release (see max_removal_pause_windows). Larger is calmer, smaller returns
# RAM sooner.
history_window_millis = 300000
# A gap between samples longer than this restarts the window above. Must be
# larger than poll_interval_millis.
maximum_gap_millis = 15000
# Ignore surpluses smaller than this, so small swings do not cause releases.
downward_hysteresis_bytes = "256MB"
