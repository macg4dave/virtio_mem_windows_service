# Total guest RAM limits, including all memory Windows can see. No boot/base
# RAM setting is needed: the policy derives the device portion from live state.
# Sizes are binary ("1GB" = 2^30 bytes). Use multiples of the live device
# block size: 8 MiB for this VM. The block size is configured in libvirt XML.
# The VM's live memory geometry must be capable of reaching these limits.
min_ram = "6GB"
max_ram = "27GB"

# This identity must match host_list.toml and the libvirt domain name. Filenames
# are exactly <vm_name>_settings.toml; names use lower-case ASCII, digits, - or _.
vm_name = "win11_gpu"
install_path = 'C:\Program Files\VirtioMemService\virtio-mem-service.exe'
service_account = 'NT AUTHORITY\LocalService'

# Optional Windows diagnostic output; omitted means no diagnostic file writes.
# It must differ from the internal control file and configuration/binary paths.
# telemetry_path = 'C:\ProgramData\VirtioMemService\diagnostics.json'
